server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;
    location ^~ /internal/ { return 404; }
    location = /v1/user/public-key { proxy_pass http://api:7606; proxy_set_header Host $host; add_header Cache-Control "no-store" always; }
    location /v1/ { proxy_pass http://api:7606; proxy_set_header Host $host; proxy_read_timeout 1800s; }
    location /query/ {
        proxy_pass http://coordinator:7010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
    location /healthz { proxy_pass http://api:7606; }
    location / { try_files $uri $uri/ /index.html; }
}
