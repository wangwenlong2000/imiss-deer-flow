name: classify_trajectory_state
display_name: 运动状态分类
short_description: 把每个用户分类为：长时静止/定向迁徙/高频巡游/随机游走。
default_prompt: "Use $classify_trajectory_state when the user wants to classify each user's trajectory into motion states such as stationary, directed migration, frequent circulation, or random walk. Run python3 scripts/classify_trajectory_state.py and summarize summary.json."
