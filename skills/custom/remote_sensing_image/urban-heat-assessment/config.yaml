# Skill: urban-heat-assessment
# English metadata + Chinese report mode.

skill:
  name: urban-heat-assessment
  version: 0.1.0
  language:
    metadata: en
    report: zh-CN

algorithm:
  # Landsat 8/9 TIRS default constants (used only if raw DN provided)
  ml: 3.3420e-4
  al: 0.1
  k1: 774.89
  k2: 1321.08
  emissivity: 0.97
  # LST classification breakpoints (Celsius)
  risk_breaks_c: [28, 32, 35, 38]
  # Suburban reference buffer ratio used if no reference_t_c provided
  suburban_ref_ratio: 0.1

cooling:
  # NDVI threshold above which a region counts as a cooling candidate
  ndvi_green: 0.3
  # Recommended minimum green-patch area (m^2)
  min_green_patch_m2: 2000

io:
  outputs_dir: ./outputs
  subdir: urban-heat-assessment

logging:
  level: INFO
