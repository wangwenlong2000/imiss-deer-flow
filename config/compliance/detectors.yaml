# 检测器开关与参数覆盖
#
# 这里**只管开关和调参**，不重复声明能力。
# 每个检测器的违规类型、适用闸门、数据类型、开销等级都写在它自己的
# `detectors/<name>/manifest.yaml` 里 —— 那是单一事实来源。
# 检测器目录搬走或删掉，声明跟着走，这个文件顶多多一行无效条目。
#
# 新增检测器接入方式见 docs/compliance-detector-integration-guide.md：
#   1. 在 backend/packages/harness/deerflow/compliance/detectors/<你的名字>/ 下放 manifest.yaml
#   2. 写一个满足 deerflow.compliance.contract.Detector 协议的实现
#      （进程内 Python / 子进程 CLI / HTTP 服务，三选一）
#   3. 在下面加一行 enabled: true
#   4. 加一个单测
#
# 未在此列出的检测器，默认 enabled: true（manifest 被发现即启用）。
# 显式写 enabled: false 才会被跳过。

detectors:
  # ── 已实现 ────────────────────────────────────────────────────────────────
  # 第 8/9/10 类：视频监控点位元数据 / 模型输出再识别风险 / 城市治理领域专有敏感
  - id: model_tfidf_knn
    # The gitignored 8/9/10 model asset is not part of this checkout. Keep this
    # local UI test instance focused on the merged rule-only type 1/2 detectors.
    enabled: false
    # 不覆盖任何参数，直接用 manifest 的 default_params（min_similarity: 0.20）。
    #
    # 为什么不抬到 0.25 —— 实测数据说话（0624 测试集 56 条，命中 31 条）：
    #
    #   真阳性最近邻相似度：n=30  min=0.1393  p10=0.2007  median=0.6376
    #   假阳性最近邻相似度：n=1   0.1316（就是那条否定语境样本）
    #
    #   阈值 0.20 → 降级 3/30 真阳性，抓住 1/1 假阳性
    #   阈值 0.25 → 降级 5/30 真阳性，抓住 1/1 假阳性  ← 多误伤 2 条，零额外收益
    #   阈值 0.30 → 降级 7/30 真阳性，抓住 1/1 假阳性
    #
    # 唯一的假阳性在 0.1316，0.20 已经足够覆盖；再往上只是单方面损失真阳性的
    # 严重度。计划 §5.2 定的也是 0.20（§4.3 里的 0.25 是在演示"怎么覆盖参数"
    # 的语法，不是调优结论）。
    #
    # 重新调这个值之前请先跑：
    #   make compliance-eval-model      # 看整体指标
    # 并重新统计上面的相似度分布，不要凭感觉调。
    params: {}

  # ── 待其他负责人填充 ──────────────────────────────────────────────────────
  # 第 1-7 类由各自数据负责人实现。骨架、路由和挂载点都已就位，
  # 实现完成后把 enabled 改成 true 即可，不需要改引擎任何代码。
  - { id: regex_struct_id, enabled: true } # 1 结构化标识符泄露
  - { id: regex_geo_loc, enabled: true } # 2 精确地理位置泄露
  - { id: entropy_hardcoded_cred, enabled: false } # 3 硬编码凭证泄露（仅 InputGate）
  - { id: keyword_illegal_content, enabled: false } # 4 违法有害内容
  - { id: keyword_political, enabled: false } # 5 政治敏感内容
  - { id: ner_text_id, enabled: false } # 6 自由文本标识符泄露
  - { id: llm_confidential, enabled: false } # 7 商业秘密与内部敏感
